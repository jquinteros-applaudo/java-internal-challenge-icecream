spring:
  application:
    name: java-challenge-1
  datasource:
    url: jdbc:h2:mem:JavChallenge;MODE=MySQL
    driverClassName: org.h2.Driver
    username: demo
    password:
  devtools:
    restart:
      enabled: true
  h2:
    console:
      enabled: true
  jpa:
    defer-datasource-initialization: true
    show-sql: true
  sql:
    init:
      mode: always
server:
  port: 8080
